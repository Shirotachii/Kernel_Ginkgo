name: Revert Commit

on:
  workflow_dispatch:
    inputs:
      commit_sha:
        description: 'Commit SHA to revert'
        required: true
        type: string

jobs:
  revert:
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Configure Git
        run: |
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git config --global user.name "github-actions[bot]"

      - name: Revert Commit
        run: |
          echo "🔄 Reverting commit: ${{ github.event.inputs.commit_sha }}"
          git revert --no-edit ${{ github.event.inputs.commit_sha }} || {
            echo "❌ Revert failed - possible conflict"
            exit 1
          }

      - name: Push Changes
        run: |
          git push origin HEAD:${{ github.ref_name }}
          echo "✅ Pushed to ${{ github.ref_name }}"

      - name: Summary
        if: success()
        run: |
          echo "## ✅ Revert Success" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Reverted Commit:** \`${{ github.event.inputs.commit_sha }}\`" >> $GITHUB_STEP_SUMMARY
          echo "**Target Branch:** \`${{ github.ref_name }}\`" >> $GITHUB_STEP_SUMMARY
          echo "**Timestamp:** $(date)" >> $GITHUB_STEP_SUMMARY

      - name: Error Summary
        if: failure()
        run: |
          echo "## ❌ Revert Failed" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Commit SHA:** \`${{ github.event.inputs.commit_sha }}\`" >> $GITHUB_STEP_SUMMARY
          echo "**Branch:** \`${{ github.ref_name }}\`" >> $GITHUB_STEP_SUMMARY
          echo "**Issue:** Check logs for conflict details" >> $GITHUB_STEP_SUMMARY
