name: Add Commit from Input

on:
  workflow_dispatch:
    inputs:
      remote_url:
        description: 'Remote repository URL'
        required: true
        default: 'https://github.com/MrShockWAVEog/android_kernel_xiaomi_mt6768-k419.git'
      commit_sha:
        description: 'Commit SHA to cherry-pick'
        required: true
      branch_name:
        description: 'Target branch name'
        required: true
        default: 'shockwave'

jobs:
  commit:
    runs-on: ubuntu-latest
    
    steps:
      - name: Validate Input
        run: |
          set -e
          commit_sha="${{ github.event.inputs.commit_sha }}"
          branch_name="${{ github.event.inputs.branch_name }}"
          remote_url="${{ github.event.inputs.remote_url }}"
          
          echo "🔍 Validating inputs..."
          
          # Validasi SHA (7 atau 40 char)
          if ! echo "$commit_sha" | grep -qE '^[a-f0-9]{7}$|^[a-f0-9]{40}$'; then
            echo "❌ ERROR: Invalid commit SHA format!"
            echo "   Format yang valid: 7 char (short) atau 40 char (full)"
            exit 1
          fi
          
          # Validasi branch name
          if ! echo "$branch_name" | grep -qE '^[a-zA-Z0-9._/-]+$'; then
            echo "❌ ERROR: Invalid branch name!"
            exit 1
          fi
          
          # Validasi URL
          if ! echo "$remote_url" | grep -qE '^https://github\.com/[a-zA-Z0-9_-]+/[a-zA-Z0-9_.-]+\.git$'; then
            echo "❌ ERROR: Invalid remote URL format!"
            exit 1
          fi
          
          echo "✅ All inputs validated!"

      - name: Checkout Repository
        uses: actions/checkout@v3
        with:
          ref: ${{ github.event.inputs.branch_name }}
          fetch-depth: 0

      - name: Configure Git
        run: |
          set -e
          git config --global user.name "GitHub Actions Bot"
          git config --global user.email "actions@github.com"
          echo "✅ Git configured"

      - name: Add Remote & Fetch
        run: |
          set -e
          remote_url="${{ github.event.inputs.remote_url }}"
          
          git remote add upstream "$remote_url" || git remote set-url upstream "$remote_url"
          git fetch upstream
          echo "✅ Fetch successful!"

      - name: Cherry-pick Commit
        run: |
          set -e
          commit_sha="${{ github.event.inputs.commit_sha }}"
          
          echo "🍒 Cherry-picking: $commit_sha"
          git cherry-pick "$commit_sha" || {
            echo "❌ ERROR: Cherry-pick failed!"
            git cherry-pick --abort || true
            exit 1
          }
          echo "✅ Cherry-pick successful!"

      - name: Push Changes
        run: |
          set -e
          branch_name="${{ github.event.inputs.branch_name }}"
          
          echo "📤 Pushing to $branch_name..."
          git push origin "$branch_name"
          echo "✅ Push successful!"

      - name: Success Summary
        if: success()
        run: |
          echo ""
          echo "✅ BERHASIL!"
          echo "Commit: ${{ github.event.inputs.commit_sha }}"
          echo "Branch: ${{ github.event.inputs.branch_name }}"
          echo ""
