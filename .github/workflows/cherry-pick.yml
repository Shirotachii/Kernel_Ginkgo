name: Cherry-Pick From External Repo

on:
  workflow_dispatch:
    inputs:
      repo_url:
        description: 'URL Repository Sumber (contoh: https://github.com/owner/repo.git)'
        required: true
        type: string
      commit_sha:
        description: 'Commit SHA yang ingin diambil'
        required: true
        type: string
      target_branch:
        description: 'Branch tujuan di repository kamu'
        required: true
        default: 'main'
        type: string

jobs:
  cherry-pick:
    runs-on: ubuntu-22.04
    permissions:
      contents: write # Wajib agar bot bisa push
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0 # Wajib agar history git lengkap

      - name: Configure Git Identity
        run: |
          git config --global user.name "GitHub Actions Bot"
          git config --global user.email "actions@github.com"

      - name: Add Remote, Fetch, and Cherry-Pick
        run: |
          # 1. Tambahkan repo orang lain sebagai remote sementara
          git remote add source-repo ${{ inputs.repo_url }}
          
          # 2. Ambil (fetch) data dari repo tersebut
          git fetch source-repo
          
          # 3. Pindah ke branch tujuan
          git checkout ${{ inputs.target_branch }}
          
          # 4. Lakukan cherry-pick berdasarkan SHA commit orang tersebut
          git cherry-pick ${{ inputs.commit_sha }}
          
          # 5. Push hasilnya ke repository kamu
          git push origin ${{ inputs.target_branch }}
